name: Signed upgrade checks
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published candidate release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Download published upgrade pair and verify matching signer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          mkdir -p baseline candidate
          gh release download v0.7.5 --repo joy-arz/komori-reader --pattern '*.apk' --dir baseline
          gh release download "$TAG" --repo joy-arz/komori-reader --pattern '*.apk' --dir candidate
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs baseline/*.apk > baseline/certificate.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs candidate/*.apk > candidate/certificate.txt
          diff <(grep 'certificate SHA-256 digest:' baseline/certificate.txt) <(grep 'certificate SHA-256 digest:' candidate/certificate.txt)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade, kill/restore and offline navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/device_acceptance.py --serial emulator-5554 --package app.komori.reader --baseline baseline/*.apk --candidate candidate/*.apk --seed-disposable-fixture
      - name: Save emulator diagnostics
        if: always()
        run: adb logcat -d > device-log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-upgrade-api-${{ matrix.api }}
          path: |
            device-log.txt
            baseline/certificate.txt
            candidate/certificate.txt
